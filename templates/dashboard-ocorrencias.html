<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard de Ocorrências - Sistema Escolar</title>

    <link rel="icon" href="/static/images/autismo-96.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v6.5.1/css/all.css"
    />
    <script src="/static/js/config.js" defer></script>
    <script src="/static/js/auth.js" defer></script>
    <script src="/static/js/dashboard-ocorrencias.js" defer></script>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>

  <body>
    <header>
      <div class="header-container">
        <h1>Dashboard de Ocorrências</h1>
        <div class="buttons">
          <button id="btn-home"><i class="fa-solid fa-house"></i> Home</button>
          <button id="btn-backward">
            <i class="fa-solid fa-arrow-left"></i> Voltar
          </button>
          <button id="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Sair
          </button>
        </div>
      </div>
    </header>

    <main>
      <div class="dashboard-container">
        <h2>Visão Geral</h2>

        <div class="cards-resumo">
          <div class="card resumo" id="card-ativas">Ativas: --</div>
          <div class="card resumo" id="card-aguardando">Aguardando: --</div>
          <div class="card resumo" id="card-atendimento">
            Em Atendimento: --
          </div>
          <div class="card resumo" id="card-resolvidas">Resolvidas: --</div>
          <div class="card resumo" id="card-encerradas">
            Encerradas s/ Solução: --
          </div>
          <div class="card resumo" id="card-fechadas">Fechadas: --</div>
        </div>

        <p
          role="status"
          aria-live="polite"
          id="mensagem-retorno"
          class="mensagem"
        ></p>
      </div>
    </main>
  </body>
</html>
