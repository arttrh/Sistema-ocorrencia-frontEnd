<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · Ocorrência escolar</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/js/config.js" defer></script>
    <script src="/static/js/login.js" defer></script>
  </head>
  <body class="pagina-login">
    <main class="entrada">
      <a class="marca" href="/">Ocorrência escolar</a>
      <h1>Acompanhe a vida escolar.</h1>
      <p>Alunos, turmas e ocorrências em um só lugar.</p>
      <form id="login-form">
        <label for="login">E-mail</label
        ><input id="login" type="email" autocomplete="username" required />
        <label for="password">Senha</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Entrar</button>
        <p id="erro-login" role="alert" hidden></p>
        <p id="logout-ok" role="status" hidden>Você saiu da sua conta.</p>
        <p id="cadastro-ok" role="status" hidden>Cadastro concluído. Entre com sua conta.</p>
      </form>
      <p class="ajuda">Ainda não tem uma conta? <a href="/cadastro.html">Cadastre-se</a>.</p>
    </main>
  </body>
</html>
